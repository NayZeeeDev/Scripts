<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ══ loading ══ -->
  <div class="splash up" id="splash">
    <div class="mark" id="splashMark"></div>
    <img class="splash-logo hidden" id="splashLogo" alt="">
  </div>

  <!-- ══ MONEY ══ -->
  <section class="tab up" data-tab="money">
    <div class="scroll">
      <header class="top">
        <button class="round" data-go="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5v.01M15 9.5v.01"/></svg>
        </button>
        <img class="top-logo hidden" id="phoneLogo" alt="">
        <div class="top-right">
          <button class="round ghost" data-go="cards">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19"/></svg>
          </button>
          <div class="avatar" id="avatar">—</div>
        </div>
      </header>

      <!-- card chip strip -->
      <div class="chip-strip" id="chipStrip"></div>

      <!-- balance -->
      <div class="sheet">
        <div class="sheet-head">
          <button class="acct-pick" data-go="accounts">
            <span id="balanceLabel">Cash balance</span>
            <em id="balanceAcct">•••• ••••</em>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6 15.5 12l-6 6"/></svg>
          </button>
          <button class="round tiny" id="hideBalance">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 12s3.6-6 9-6 9 6 9 6-3.6 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20 20 4"/></svg>
          </button>
        </div>

        <b class="huge" id="balance">$0</b>

        <div class="pills">
          <button class="pill solid" data-go="send">Send</button>
          <button class="pill" data-go="request">Request</button>
        </div>

        <div class="od-line hidden" id="odLine"></div>
        <p class="hint-line">Cash goes in and out at an ATM or a branch.</p>

        <div class="stack" id="moneyStack"></div>
      </div>
    </div>
  </section>

  <!-- ══ PAY ══ -->
  <section class="tab pay-tab" data-tab="pay">
    <header class="top pay-top">
      <button class="round dark" data-go="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5v.01M15 9.5v.01"/></svg>
      </button>
      <div class="top-right">
        <div class="avatar dark" id="avatarPay">—</div>
      </div>
    </header>

    <div class="pay-amount" id="payAmount">$0</div>
    <div class="pay-note" id="payNote">Enter an amount</div>

    <div class="keypad" id="keypad">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="clear" class="sub">C</button>
      <button data-key="0">0</button>
      <button data-key="del" class="sub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6 20 6a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-5.5L4 12l10.5-6z"/><path d="M11 10l5 4M16 10l-5 4"/></svg>
      </button>
    </div>

    <div class="pay-actions">
      <button class="pill flat" data-go="bills">Bills</button>
      <button class="pill flat" data-go="borrow">Borrow</button>
    </div>
    <div class="pay-go-row">
      <button class="pay-go" id="payRequest">Request</button>
      <button class="pay-go solid" id="payGo">Send</button>
    </div>
  </section>

  <!-- ══ ACTIVITY ══ -->
  <section class="tab" data-tab="activity">
    <div class="scroll">
      <header class="top">
        <button class="round" data-go="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5v.01M15 9.5v.01"/></svg>
        </button>
        <div class="top-right"><div class="avatar" id="avatarAct">—</div></div>
      </header>
      <div class="rule"></div>
      <div id="activityBody"></div>
    </div>
  </section>

  <!-- ══ WHO — pick somebody to pay ══ -->
  <section class="sheet-page" data-page="who">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
      <b id="whoTitle">Send to</b>
      <em class="page-amount" id="whoAmount"></em>
    </header>

    <div class="seg" id="whoSeg">
      <button class="on" data-who="nearby">Nearby</button>
      <button data-who="recent">Recent</button>
      <button data-who="contacts">Contacts</button>
    </div>

    <div class="who-manual">
      <input id="whoNumber" inputmode="numeric" placeholder="Or type an account number">
      <button class="pill solid" id="whoManualGo">Go</button>
    </div>

    <div class="scroll pad" id="whoBody"></div>
  </section>

  <!-- ══ INVESTING ══ -->
  <section class="sheet-page" data-page="invest">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
      <b>Investing</b>
    </header>
    <div class="scroll pad" id="investBody"></div>
  </section>

  <!-- ══ ONE ASSET ══ -->
  <section class="sheet-page dark-page" data-page="asset">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 9 12l6 6"/></svg></button>
      <b id="assetName">Asset</b>
    </header>
    <div class="scroll" id="assetBody"></div>
    <div class="asset-actions">
      <button class="pill flat" id="assetSell">Sell</button>
      <button class="pill solid" id="assetBuy">Buy</button>
    </div>
  </section>

  <!-- ══ BORROW ══ -->
  <section class="sheet-page" data-page="borrow">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
      <b>Borrow</b>
    </header>
    <div class="scroll pad" id="borrowBody"></div>
  </section>

  <!-- ══ sub-screens ══ -->
  <section class="sheet-page" data-page="cards">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
      <b>Cards</b>
    </header>
    <div class="scroll pad" id="cardsBody"></div>
  </section>

  <section class="sheet-page" data-page="accounts">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
      <b>Accounts</b>
    </header>
    <div class="scroll pad" id="accountsBody"></div>
  </section>

  <section class="sheet-page" data-page="bills">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
      <b>Bills</b>
    </header>
    <div class="scroll pad" id="billsBody"></div>
  </section>

  <section class="sheet-page" data-page="statement">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
      <b>Statement</b>
    </header>
    <div class="seg" id="stSeg">
      <button class="on" data-period="week">7 days</button>
      <button data-period="month">30 days</button>
      <button data-period="all">All</button>
    </div>
    <div class="scroll pad" id="statementBody"></div>
  </section>

  <section class="sheet-page" data-page="settings">
    <header class="page-top">
      <button class="round" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button>
    </header>
    <div class="scroll pad" id="settingsBody"></div>
  </section>

  <!-- ══ prompt ══ -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <b id="modalTitle">Send money</b>
      <span id="modalText"></span>
      <div id="modalFields"></div>
      <div class="modal-row">
        <button class="pill flat" data-modal="cancel">Cancel</button>
        <button class="pill solid" data-modal="ok" id="modalOk">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ══ bottom bar ══ -->
  <nav class="bar" id="bar">
    <button data-tab-go="money">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5M5 10v9M19 10v9M9.5 10v9M14.5 10v9M3 20h18"/></svg>
    </button>
    <button data-tab-go="pay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 3v18M16.5 7.2A4 4 0 0 0 12.8 5h-1.3a3.3 3.3 0 0 0 0 6.6h1a3.4 3.4 0 0 1 0 6.8h-1.4a4.1 4.1 0 0 1-3.6-2.2"/></svg>
    </button>
    <button data-tab-go="activity">
      <span class="dot hidden" id="actDot">0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/></svg>
    </button>
  </nav>

  <div class="toasts" id="toasts"></div>
</div>

<script src="app.js"></script>
</body>
</html>
