<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Lexend';src:url(fonts/lexend.woff2) format('woff2');font-weight:100 900}
:root{--a:#08afa2}
html,body{margin:0;width:1920px;height:384px;overflow:hidden;background:transparent;font-family:'Lexend',sans-serif;color:#fff}
.s{position:absolute;top:0;width:384px;height:384px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18px;box-sizing:border-box;visibility:hidden}
.s.on{visibility:visible}
.n{font-size:30px;font-weight:600;letter-spacing:.34em;text-indent:.34em;color:rgba(255,255,255,.92);text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 2px #000}
.d{font-size:96px;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:6px;text-shadow:0 3px 10px rgba(0,0,0,.85),0 0 3px #000}
.d small{font-size:.42em;font-weight:600;margin-left:6px;letter-spacing:0;color:rgba(255,255,255,.85)}
.m{margin-top:16px;width:44px;height:44px;background:var(--a);clip-path:polygon(0 0,100% 0,100% 56%,56% 100%,0 100%);box-shadow:0 0 18px var(--a);border-radius:6px}
.s.up .d{font-size:64px;opacity:.7}.s.up .n{font-size:22px;opacity:.7}.s.up .m{background:#fff;width:32px;height:32px}
.s.fin .m{background:#fff;background-image:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0);background-size:22px 22px}
</style></head>
<body>
<script>
const slots=[];let units='kmh',label='CHECKPOINT',finish='FINISH';
for(let i=0;i<5;i++){const e=document.createElement('div');e.className='s'+(i?' up':'');e.style.left=(i*384)+'px';
e.innerHTML='<div class="n"></div><div class="d"></div><div class="m"></div>';document.body.appendChild(e);slots.push(e);}
function fmt(m){if(units==='mph'){const yd=m*1.09361;return yd>=1760?[(yd/1760).toFixed(1),'mi']:[Math.round(yd),'yd'];}
return m>=1000?[(m/1000).toFixed(1),'km']:[m,'m'];}
window.addEventListener('message',e=>{let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return}}
if(!d)return;if(!Array.isArray(d)){if(d.accent)document.documentElement.style.setProperty('--a',d.accent);
if(d.units)units=d.units;if(d.label)label=d.label;if(d.finish)finish=d.finish;return;}
slots.forEach((el,i)=>{const s=d[i];if(!s){el.classList.remove('on');return;}const f=fmt(s.d);
el.querySelector('.n').textContent=s.f?finish:label+' '+s.n;el.querySelector('.d').innerHTML=f[0]+'<small>'+f[1]+'</small>';
el.classList.toggle('fin',!!s.f);el.classList.add('on');});});
</script>
</body></html>
