<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAYZEEE · 07 Showroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../core/nz-core.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="show nz-app" id="app">
  <aside class="cat">
    <div class="nz-lockup">
      <div class="nz-mark"></div>
      <div><div class="nz-title" id="dealer">Premium Deluxe Motorsport</div><div class="nz-sub" id="dealer-sub">Downtown · Est. 1994</div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list nz-scroll" id="list"></div>
    <span class="nz-sig"><span class="nz-mark xs"></span>NAYZEEE</span>
  </aside>

  <div class="drag-zone" id="drag"></div>
  <div class="stage"><span>VEHICLE PREVIEW</span></div>
  <div class="rotate nz-hints">
    <span><span class="nz-key">A</span><span class="nz-key">D</span>Rotate</span>
    <span><span class="nz-key">Drag</span>Turn</span>
    <span><span class="nz-key">ESC</span>Leave</span>
  </div>

  <section class="spec">
    <div class="make" id="make">Pegassi</div>
    <h1 id="name">Zentorno</h1>
    <div class="tags" id="tags"></div>
    <div class="bars" id="bars"></div>
    <div class="facts" id="facts"></div>
    <div class="paint">
      <p>Paint · <b id="paint-name">Ice White</b></p>
      <div class="swatches" id="swatches"></div>
    </div>
  </section>

  <div class="deal">
    <div class="price"><span>Price</span><b id="price">$725,000</b><small id="finance">or $14,500 / week · 50 weeks</small></div>
    <div class="acts">
      <button class="nz-btn line" id="test"><i data-ic="timer"></i>Test drive</button>
      <button class="nz-btn teal" id="buy"><i data-ic="key"></i>Purchase</button>
    </div>
  </div>
</div>

<script src="../core/nz-core.js"></script>
<script src="app.js"></script>
</body>
</html>
