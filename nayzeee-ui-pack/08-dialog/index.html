<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAYZEEE · 08 Dialog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../core/nz-core.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dialog nz-app" id="app">
  <div class="lb top">
    <div class="ctx"><div class="nz-mark sm"></div><span>CONVERSATION</span><b id="place">PILLBOX MEDICAL</b></div>
    <span class="nz-sig"><span class="nz-mark xs"></span>NAYZEEE</span>
  </div>
  <div class="shade"></div>

  <div class="talk" id="talk">
    <div>
      <div class="who">
        <div class="nz-av" id="av">EV</div>
        <div><h2 id="name">Dr. Elena Voss</h2><p id="role">Pillbox Medical · Head of surgery</p></div>
        <div class="rep" id="rep"><span>Trust</span><div class="nz-meter"><i id="rep-v"></i></div></div>
      </div>
      <p class="line" id="line"></p>
      <div class="skip" id="skip"><span class="nz-key">SPACE</span>Skip</div>
    </div>
    <div class="opts" id="opts"></div>
  </div>

  <div class="lb bot nz-hints">
    <span><span class="nz-key">1-6</span>Reply</span>
    <span><span class="nz-key">↑↓</span>Choose</span>
    <span><span class="nz-key">↵</span>Confirm</span>
    <span><span class="nz-key">ESC</span>Walk away</span>
  </div>
</div>

<script src="../core/nz-core.js"></script>
<script src="app.js"></script>
</body>
</html>
