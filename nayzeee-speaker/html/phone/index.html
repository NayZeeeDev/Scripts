<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaker</title>
<script>
/* keep the phone's status bar and home bar clear before the first paint (?top=50&bottom=28) */
(function () {
  var q = new URLSearchParams(location.search), r = document.documentElement.style;
  ['top', 'bottom'].forEach(function (k) {
    var v = parseFloat(q.get(k));
    if (v >= 0 && v <= 160) r.setProperty(k === 'top' ? '--st' : '--sb', v + 'px');
  });
})();
</script>
<link rel="stylesheet" href="../css/fa.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="top-in">
      <div class="brand" id="brand"><div class="mark"></div></div>
      <h1 id="title">Speaker</h1>
      <button class="dev-pill" id="devPill" data-a="devices" aria-label="Choose a speaker"></button>
    </div>
  </header>

  <main class="scroll" id="scroll">
    <section class="view" id="v-home"><div class="skel" style="height:320px"></div></section>
    <section class="view" id="v-search" hidden>
      <form class="field" id="searchForm" autocomplete="off">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="q" type="text" enterkeyhint="search" spellcheck="false" maxlength="120">
        <button class="ib" type="button" id="qClear" data-a="clearSearch" aria-label="Clear" hidden><i class="fa-solid fa-xmark"></i></button>
      </form>
      <div id="searchTarget"></div>
      <div id="searchBody"></div>
    </section>
    <section class="view" id="v-library" hidden></section>
    <section class="view" id="v-jam" hidden></section>
  </main>

  <div class="mini" id="mini" data-a="openNp" role="button" hidden></div>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-a="tab" data-v="home"><i class="fa-solid fa-house"></i><span data-t="home">Home</span></button>
    <button class="tab" data-a="tab" data-v="search"><i class="fa-solid fa-magnifying-glass"></i><span data-t="search">Search</span></button>
    <button class="tab" data-a="tab" data-v="library"><i class="fa-solid fa-book-bookmark"></i><span data-t="library">Library</span></button>
    <button class="tab" data-a="tab" data-v="jam"><i class="fa-solid fa-user-group"></i><span data-t="jam">Jam</span></button>
  </nav>

  <section class="np" id="np" aria-hidden="true">
    <div class="ambient" id="npAmbient"></div>
    <div class="np-scroll" id="npScroll"><div id="npBody"></div></div>
    <div class="np-head" id="npHead"></div>
  </section>

  <div class="sheet" id="sheet" hidden>
    <div class="scrim" data-a="closeSheet"></div>
    <div class="sheet-card" id="sheetCard"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>
<script src="app.js"></script>
</body>
</html>
