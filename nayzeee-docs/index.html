<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NayZeeeDev Docs</title>
<meta name="description" content="Installation, configuration, exports and FAQ for every NayZeeeDev script.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══ NAYZEEE DOCS · same tokens as the store ═══ */
:root{--void:#000;--base:#08090a;--panel:#0e1011;--raise:#15181a;--raise-2:#1c2023;--inset:#0b0c0d;--line:rgba(255,255,255,.10);--line-soft:rgba(255,255,255,.06);--line-hair:rgba(255,255,255,.035);--white:#fff;--ink:#f2f4f5;--ink-2:#9ea5aa;--ink-3:#63696d;--teal:#08afa2;--teal-hi:#0fd4c4;--teal-lo:#067d74;--teal-rgb:8,175,162;--teal-wash:rgba(var(--teal-rgb),.11);--teal-edge:rgba(var(--teal-rgb),.34);--on-teal:#00201d;--red:#e5484d;--red-wash:rgba(229,72,77,.11);--red-edge:rgba(229,72,77,.34);--amber:#e5a50a;--r-xs:4px;--r-sm:6px;--r-md:10px;--sh-2:0 2px 6px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);--fast:130ms cubic-bezier(.4,0,.2,1);--nav-h:60px;--side:272px;--toc:220px;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Lexend',system-ui,sans-serif;background:var(--void);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}svg{display:block}
.ic{width:16px;height:16px;flex:none;stroke-width:1.6}
.mark{position:relative;flex:none;width:28px;height:28px;background:linear-gradient(155deg,var(--teal-hi),var(--teal-lo));border-radius:6px;clip-path:polygon(0 0,100% 0,100% 56%,56% 100%,0 100%);box-shadow:0 2px 12px rgba(var(--teal-rgb),.3)}
.mark::after{content:'';position:absolute;left:22%;top:22%;width:56%;height:22%;background:var(--void);opacity:.85;border-radius:1px}
.logo{height:28px;width:auto}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:16px;padding:0 4px;border-radius:3px;background:var(--raise);border:1px solid var(--line);font-size:9px;color:var(--ink-2);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:var(--r-xs);color:var(--teal);background:var(--teal-wash);border:1px solid var(--teal-edge);text-transform:uppercase;white-space:nowrap}
.chip.grey{color:var(--ink-2);background:var(--raise);border-color:var(--line-soft)}
.vtag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-xs);font-family:var(--mono);font-size:10px;font-weight:500;color:var(--teal);border:1px solid var(--teal-edge);background:var(--teal-wash)}
.fwc{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 8px;border-radius:var(--r-sm);background:var(--raise);border:1px solid var(--line-soft);font-size:11.5px;font-weight:500;color:var(--ink-2)}
.fwc img{height:13px;width:auto}.fwc img.esx{height:10px}
.btn-teal{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:var(--r-xs);background:linear-gradient(var(--teal),var(--teal-lo));color:var(--on-teal);font-size:12px;font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.3) inset}
.btn-line{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:var(--r-xs);border:1px solid var(--line);color:var(--ink-2);font-size:12px;font-weight:300}
.btn-line:hover{border-color:var(--ink-3);color:var(--white)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r-xs);border:1px solid var(--line);color:var(--ink-2);font-size:11.5px;font-weight:300}
.btn-ghost:hover{border-color:var(--teal-edge);color:var(--teal);background:var(--teal-wash)}

/* top bar */
.top{position:sticky;top:0;z-index:50;height:var(--nav-h);background:linear-gradient(var(--panel),rgba(8,9,10,.97));border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;padding:0 20px}
.brand{display:flex;align-items:center;gap:11px;padding-right:18px;margin-right:6px;border-right:1px solid var(--line-soft);height:100%}
.brand b{font-size:12.5px;font-weight:600;color:var(--white);letter-spacing:.055em;white-space:nowrap}
.brand span{display:block;font-size:10px;color:var(--ink-3);font-weight:300;letter-spacing:.055em;margin-top:4px}
.search{flex:1;max-width:460px;position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:11px;color:var(--ink-3);pointer-events:none}
.search input{height:34px;width:100%;padding:0 60px 0 34px;background:var(--inset);border:1px solid var(--line-soft);border-radius:var(--r-xs);color:var(--white);font:inherit;font-size:12.5px}
.search input::placeholder{color:var(--ink-3)}.search input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-wash)}
.search .kbd{position:absolute;right:10px}
.sr{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:380px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-2);padding:6px;display:none;z-index:60}
.sr.on{display:block}
.sr a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:var(--r-sm)}
.sr a:hover,.sr a.on{background:var(--raise)}
.sr b{font-size:12.5px;font-weight:500;color:var(--white)}.sr span{font-size:10.5px;color:var(--ink-3);font-weight:300}
.sr mark{background:var(--teal-wash);color:var(--teal);border-radius:2px;padding:0 2px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.burger{display:none;width:34px;height:34px;place-items:center;border-radius:var(--r-sm);color:var(--ink-2);border:1px solid var(--line-soft)}

/* layout */
.wrap{display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--toc);gap:0;max-width:1440px;margin:0 auto}
.side{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));overflow-y:auto;padding:18px 14px 40px;border-right:1px solid var(--line-soft);background:linear-gradient(180deg,var(--base),#050607)}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--base)}
.grp{display:flex;align-items:center;gap:9px;margin:16px 6px 6px;font-size:10.5px;color:var(--ink-3);font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.grp::after{content:'';flex:1;height:1px;background:var(--line-hair)}
.grp:first-child{margin-top:4px}
.nav{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;font-weight:300;color:var(--ink-2);transition:background var(--fast),color var(--fast)}
.nav .ic{width:15px;height:15px;opacity:.7}
.nav:hover{background:var(--raise);color:var(--white)}
.nav.on{background:var(--teal-wash);color:var(--white);font-weight:500}.nav.on .ic{color:var(--teal);opacity:1}
.nav.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--teal);border-radius:0 2px 2px 0;box-shadow:0 0 9px var(--teal)}
.nav .vtag{margin-left:auto;height:16px;font-size:9px}
.main{padding:28px 40px 80px;min-width:0}
.crumb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);font-weight:300;margin-bottom:16px}
.crumb .ic{width:12px;height:12px;opacity:.6}.crumb b{color:var(--ink-2);font-weight:500}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line-soft);margin-bottom:24px}
.head h1{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.08;color:var(--white)}
.head p{font-size:13px;color:var(--ink-3);margin-top:8px;font-weight:300;max-width:64ch;line-height:1.55}
.head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.toc{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));overflow-y:auto;padding:28px 18px 40px 14px;border-left:1px solid var(--line-soft)}
.toc h5{font-size:10.5px;color:var(--ink-3);font-weight:400;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.toc a{display:block;font-size:11.5px;color:var(--ink-3);font-weight:300;padding:4px 0 4px 10px;border-left:1px solid var(--line-hair);transition:all var(--fast)}
.toc a.l3{padding-left:22px}
.toc a:hover{color:var(--white)}.toc a.on{color:var(--teal);border-left-color:var(--teal)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line-soft)}
.pager a{display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-md);transition:border-color var(--fast)}
.pager a:hover{border-color:var(--teal-edge)}
.pager a.next{text-align:right;align-items:flex-end}
.pager small{font-size:10.5px;color:var(--ink-3);font-weight:300}.pager b{font-size:13px;font-weight:500;color:var(--white)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;font-size:10.5px;color:var(--ink-3);font-weight:300;flex-wrap:wrap}
.foot b{color:var(--ink-2);font-weight:500}

/* prose */
.prose{font-size:13.5px;color:var(--ink-2);font-weight:300;line-height:1.75;max-width:78ch}
.prose h2{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--white);margin:2.2em 0 .7em;padding-top:.6em;border-top:1px solid var(--line-hair);scroll-margin-top:80px}
.prose h2:first-child{margin-top:0;border-top:0;padding-top:0}
.prose h3{font-size:15px;font-weight:600;color:var(--white);margin:1.6em 0 .5em;scroll-margin-top:80px}
.prose h4{font-size:13px;font-weight:600;color:var(--white);margin:1.3em 0 .4em}
.prose p{margin:0 0 1em}
.prose a{color:var(--teal);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--teal-edge)}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.3em}.prose li{margin:.3em 0}.prose li::marker{color:var(--ink-3)}
.prose strong{color:var(--white);font-weight:500}
.prose code{font-family:var(--mono);font-size:12px;background:var(--raise);padding:2px 6px;border-radius:var(--r-xs);color:var(--teal);border:1px solid var(--line-hair)}
.prose img{max-width:100%;border-radius:var(--r-md);border:1px solid var(--line-soft);margin:1em 0;display:block}
.prose hr{border:0;border-top:1px solid var(--line-soft);margin:2em 0}
.prose blockquote{border-left:2px solid var(--teal-edge);padding:4px 0 4px 14px;margin:1em 0;color:var(--ink-3)}
.prose table{width:100%;border-collapse:collapse;margin:1em 0;font-size:12.5px;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line-soft);padding:8px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--raise);color:var(--white);font-weight:500;white-space:nowrap}
.prose td code{white-space:nowrap}
.code{position:relative;margin:1em 0;background:var(--inset);border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden}
.code .bar{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 14px;border-bottom:1px solid var(--line-hair);background:var(--panel);font-size:10.5px;color:var(--ink-3);font-weight:400;letter-spacing:.04em;text-transform:uppercase}
.code .bar .cp{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:var(--r-xs);border:1px solid var(--line-soft);color:var(--ink-2);font-size:10.5px;text-transform:none;letter-spacing:0}
.code .bar .cp:hover{border-color:var(--teal-edge);color:var(--teal)}
.code .bar .cp .ic{width:12px;height:12px}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--ink)}
.code pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.tk-c{color:var(--ink-3);font-style:italic}.tk-s{color:#9fe683}.tk-k{color:#7bcdff}.tk-n{color:#ffb020}.tk-f{color:var(--teal-hi)}
.call{display:flex;gap:12px;padding:12px 14px;margin:1em 0;border-radius:var(--r-sm);background:var(--teal-wash);border:1px solid var(--teal-edge);color:var(--ink)}
.call .ic{color:var(--teal);margin-top:2px}
.call.warn{background:rgba(229,165,10,.1);border-color:rgba(229,165,10,.35)}.call.warn .ic{color:var(--amber)}
.call.danger{background:var(--red-wash);border-color:var(--red-edge)}.call.danger .ic{color:var(--red)}
.call b{display:block;font-size:12.5px;font-weight:600;color:var(--white);margin-bottom:2px}
.call p{margin:0;font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:1em 0}
.card{display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-md);transition:border-color var(--fast)}
.card:hover{border-color:var(--teal-edge)}
.card b{font-size:13px;font-weight:600;color:var(--white)}.card span{font-size:11.5px;color:var(--ink-3);font-weight:300;line-height:1.5}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{position:relative;padding-left:36px;margin:0 0 .9em}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--teal-wash);border:1px solid var(--teal-edge);color:var(--teal);font-size:11px;font-weight:600;display:grid;place-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:1em 0;font-size:12.5px}
.kv dt{font-family:var(--mono);font-size:11.5px;color:var(--teal)}.kv dd{color:var(--ink-2)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:120}
.toast{display:flex;gap:11px;align-items:flex-start;width:300px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--teal);border-radius:var(--r-sm);box-shadow:var(--sh-2);font-size:12px;animation:tin .22s both}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:none}
@media (max-width:1100px){.wrap{grid-template-columns:var(--side) minmax(0,1fr)}.toc{display:none}}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}.main{padding:22px 18px 60px}
  .side{position:fixed;top:0;left:0;bottom:0;height:100vh;width:min(300px,100%);z-index:45;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--sh-2)}
  .side.on{transform:none}.scrim.on{display:block}
  .burger{display:grid}.brand span{display:none}.search{max-width:none}.top .r .btn-line{display:none}.top .r .btn-teal{padding:0 10px;font-size:0;gap:0}.top{padding:0 12px;gap:8px}.brand{padding-right:10px}
}
</style>
</head>

<header class="top">
  <button class="burger" id="burger" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
  <a class="brand" href="#/" id="brand"><div class="mark"></div><div><b id="brandName">NAYZEEE DEV</b><span id="brandSub">Documentation</span></div></a>
  <div class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="Search docs…" autocomplete="off"><span class="kbd">/</span><div class="sr" id="sr"></div></div>
  <div class="r">
    <a class="btn-line" id="storeLink" href="#" target="_blank" rel="noopener"><svg class="ic"><use href="#i-bag"/></svg>Store</a>
    <a class="btn-teal" id="discordLink" href="#" target="_blank" rel="noopener"><svg class="ic"><use href="#i-discord"/></svg>Support</a>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
  <aside class="toc" id="toc"></aside>
</div>
<div class="toasts" id="toasts"></div>

<script src="content.js"></script>
<script>
/* ═══ tiny docs engine: routes #/section/page, renders markdown from content.js ═══ */
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var D = window.DOCS;
  $('#brandName').textContent = D.site.name; $('#brandSub').textContent = D.site.tagline || 'Documentation'; document.title = D.site.name + ' Docs';
  if (D.site.logo) { var img = document.createElement('img'); img.className = 'logo'; img.src = D.site.logo; img.alt = D.site.name; $('#brand .mark').replaceWith(img); }
  $('#storeLink').href = D.site.store || '#'; $('#discordLink').href = D.site.discord || '#';
  var FW = { esx: D.site.logos && D.site.logos.esx, qb: D.site.logos && D.site.logos.qb, qbx: D.site.logos && D.site.logos.qbx };
  function fwChip(n) { var k = /esx/i.test(n) ? 'esx' : /qbx|qbox/i.test(n) ? 'qbx' : /qb/i.test(n) ? 'qb' : ''; var lab = k === 'esx' ? 'ESX' : k === 'qbx' ? 'QBox' : k === 'qb' ? 'QBCore' : n; return '<span class="fwc">' + (k && FW[k] ? '<img class="' + k + '" src="' + FW[k] + '" alt="">' : '') + esc(lab) + '</span>'; }

  /* flat page list */
  var pages = [];
  D.sections.forEach(function (s) { s.pages.forEach(function (p) { p.section = s; p.path = '/' + s.slug + '/' + p.slug; pages.push(p); }); });
  var slug = function (t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); };

  /* markdown → html (headings, paragraphs, lists, code fences, tables, callouts, links, images, inline) */
  function hl(code, lang) {
    lang = (lang || '').toLowerCase();
    var cm = /^(lua)$/.test(lang) ? '--[^\\n]*' : /^(js|javascript|ts|typescript|json)$/.test(lang) ? '\\/\\/[^\\n]*' : /^(bash|sh|cfg|yaml|yml|ini|toml)$/.test(lang) ? '#[^\\n]*' : /^sql$/.test(lang) ? '--[^\\n]*' : null;
    if (!cm) return esc(code);
    var re = new RegExp('(' + cm + ')|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|\\b(local|function|end|if|then|else|elseif|return|for|do|while|in|not|and|or|nil|true|false|const|let|var|export|import|from|async|await|new|exports?|ensure|start|stop|SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE)\\b|\\b(\\d+(?:\\.\\d+)?)\\b|([A-Za-z_][\\w.:]*)(?=\\s*\\()', 'g');
    var out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index)); last = m.index + m[0].length;
      var cls = m[1] ? 'tk-c' : m[2] ? 'tk-s' : m[3] ? 'tk-k' : m[4] ? 'tk-n' : 'tk-f';
      out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    }
    return out + esc(code.slice(last));
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function (_, c) { return '<code>' + c + '</code>'; });
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, '$1<em>$2</em>');
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) { return '<a href="' + u + '"' + (/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '') + '>' + t + '</a>'; });
    s = s.replace(/\{fw:([^}]+)\}/g, function (_, list) { return '<span style="display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle">' + list.split(',').map(function (x) { return fwChip(x.trim()); }).join('') + '</span>'; });
    s = s.replace(/\{v:([^}]+)\}/g, '<span class="vtag">v$1</span>').replace(/\{kbd:([^}]+)\}/g, '<span class="kbd">$1</span>');
    return s;
  }
  function md(src, headings) {
    var lines = src.replace(/\r/g, '').split('\n'), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) { var lang = l.slice(3).trim(), buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<div class="code"><div class="bar">' + esc(lang || 'code') + '<button class="cp" type="button"><svg class="ic"><use href="#i-copy"/></svg>Copy</button></div><pre><code>' + hl(buf.join('\n'), lang) + '</code></pre></div>'); continue; }
      var h = l.match(/^(#{1,4})\s+(.+)$/);
      if (h) { var lvl = h[1].length, txt = h[2].trim(), id = slug(txt); if (lvl >= 2 && lvl <= 3) headings.push({ l: lvl, t: txt, id: id }); out.push('<h' + lvl + ' id="' + id + '">' + inline(txt) + '</h' + lvl + '>'); i++; continue; }
      var c = l.match(/^>\s*\[!(NOTE|TIP|WARNING|DANGER)\]\s*(.*)$/i);
      if (c) { var kind = c[1].toUpperCase(), body = [c[2]]; i++; while (i < lines.length && /^>\s?/.test(lines[i])) body.push(lines[i++].replace(/^>\s?/, '')); var first = body.shift(); out.push('<div class="call ' + (kind === 'WARNING' ? 'warn' : kind === 'DANGER' ? 'danger' : '') + '"><svg class="ic"><use href="#i-' + (kind === 'NOTE' || kind === 'TIP' ? 'info' : 'warn') + '"/></svg><div><b>' + inline(first || kind) + '</b><p>' + inline(body.join(' ')) + '</p></div></div>'); continue; }
      if (/^>\s?/.test(l)) { var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, '')); out.push('<blockquote>' + inline(q.join(' ')) + '</blockquote>'); continue; }
      if (/^\|/.test(l)) { var rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]); rows = rows.filter(function (r) { return !/^\|\s*:?-+/.test(r); }); var cells = function (r) { return r.replace(/^\||\|$/g, '').split('|').map(function (x) { return x.trim(); }); }; var th = cells(rows.shift()); out.push('<table><thead><tr>' + th.map(function (x) { return '<th>' + inline(x) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + cells(r).map(function (x) { return '<td>' + inline(x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>'); continue; }
      if (/^(\s*)([-*]|\d+\.)\s+/.test(l)) { var ol = /^\s*\d+\./.test(l), items = []; while (i < lines.length && /^(\s*)([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^(\s*)([-*]|\d+\.)\s+/, '')); out.push((ol ? '<ol class="steps">' : '<ul>') + items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + (ol ? '</ol>' : '</ul>')); continue; }
      if (/^---+$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^:::cards/.test(l)) { var cs = []; i++; while (i < lines.length && !/^:::/.test(lines[i])) { var m2 = lines[i].match(/^-\s*\[([^\]]+)\]\(([^)]+)\)\s*(.*)$/); if (m2) cs.push('<a class="card" href="' + m2[2] + '"><b>' + inline(m2[1]) + '</b><span>' + inline(m2[3]) + '</span></a>'); i++; } i++; out.push('<div class="cards">' + cs.join('') + '</div>'); continue; }
      if (/^:::kv/.test(l)) { var kv = []; i++; while (i < lines.length && !/^:::/.test(lines[i])) { var m3 = lines[i].match(/^([^:]+):\s*(.*)$/); if (m3) kv.push('<dt>' + esc(m3[1].trim()) + '</dt><dd>' + inline(m3[2]) + '</dd>'); i++; } i++; out.push('<dl class="kv">' + kv.join('') + '</dl>'); continue; }
      if (!l.trim()) { i++; continue; }
      var p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\||\s*[-*]\s|\s*\d+\.\s|:::|---)/.test(lines[i])) p.push(lines[i++]);
      if (!p.length) { i++; continue; }
      out.push('<p>' + inline(p.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  function renderNav(cur) {
    $('#side').innerHTML = D.sections.map(function (s) { return '<div class="grp">' + esc(s.title) + '</div>' + s.pages.map(function (p) { return '<a class="nav' + (cur && cur.path === p.path ? ' on' : '') + '" href="#' + p.path + '"><svg class="ic"><use href="#i-' + (p.icon || s.icon || 'book') + '"/></svg>' + esc(p.title) + (p.version ? '<span class="vtag">v' + esc(p.version) + '</span>' : '') + '</a>'; }).join(''); }).join('');
  }
  function render() {
    var hash = location.hash.replace(/^#/, '') || pages[0].path;
    var page = pages.filter(function (p) { return p.path === hash; })[0] || pages[0];
    var idx = pages.indexOf(page), prev = pages[idx - 1], next = pages[idx + 1], heads = [];
    var body = md(page.body || '', heads);
    var meta = [];
    if (page.version) meta.push('<span class="vtag">v' + esc(page.version) + '</span>');
    if (page.frameworks) meta.push(page.frameworks.map(fwChip).join(''));
    if (page.store) meta.push('<a class="btn-ghost" href="' + page.store + '" target="_blank" rel="noopener"><svg class="ic" style="width:13px;height:13px"><use href="#i-bag"/></svg>Get it in the store</a>');
    $('#main').innerHTML = '<div class="crumb"><a href="#/">Docs</a><svg class="ic"><use href="#i-chev"/></svg><span>' + esc(page.section.title) + '</span><svg class="ic"><use href="#i-chev"/></svg><b>' + esc(page.title) + '</b></div>' +
      '<div class="head"><div><h1>' + esc(page.title) + '</h1>' + (page.summary ? '<p>' + inline(page.summary) + '</p>' : '') + (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '') + '</div></div>' +
      '<article class="prose">' + body + '</article>' +
      '<div class="pager">' + (prev ? '<a href="#' + prev.path + '"><small>Previous</small><b>' + esc(prev.title) + '</b></a>' : '<span></span>') + (next ? '<a class="next" href="#' + next.path + '"><small>Next</small><b>' + esc(next.title) + '</b></a>' : '') + '</div>' +
      '<div class="foot"><span>' + esc(D.site.footer || ('© ' + new Date().getFullYear() + ' ' + D.site.name)) + '</span><span>Built on <b>NAYZEEE UI</b></span></div>';
    $('#toc').innerHTML = heads.length ? '<h5>On this page</h5>' + heads.map(function (h) { return '<a class="' + (h.l === 3 ? 'l3' : '') + '" href="#' + page.path + '?h=' + h.id + '" data-h="' + h.id + '">' + esc(h.t) + '</a>'; }).join('') : '';
    renderNav(page); document.title = page.title + ' · ' + D.site.name + ' Docs';
    $$('.code .cp').forEach(function (b) { b.addEventListener('click', function () { var t = b.closest('.code').querySelector('pre').textContent; if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { b.innerHTML = '<svg class="ic"><use href="#i-check"/></svg>Copied'; setTimeout(function () { b.innerHTML = '<svg class="ic"><use href="#i-copy"/></svg>Copy'; }, 1500); }); }); });
    var q = (location.hash.split('?h=')[1] || ''); if (q) { var el = document.getElementById(q); if (el) setTimeout(function () { el.scrollIntoView({ block: 'start' }); }, 30); } else window.scrollTo(0, 0);
    $('#side').classList.remove('on'); $('#scrim').classList.remove('on');
    observe();
  }
  var io;
  function observe() {
    if (io) io.disconnect(); var links = $$('#toc a'); if (!links.length || !('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(function (en) { en.forEach(function (e) { if (e.isIntersecting) { links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-h') === e.target.id); }); } }); }, { rootMargin: '-70px 0px -70% 0px' });
    $$('.prose h2, .prose h3').forEach(function (h) { io.observe(h); });
  }
  window.addEventListener('hashchange', render);
  document.addEventListener('click', function (e) { var a = e.target.closest('#toc a'); if (a) { e.preventDefault(); var el = document.getElementById(a.getAttribute('data-h')); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); } if (e.target.closest('#burger')) { $('#side').classList.add('on'); $('#scrim').classList.add('on'); } if (e.target.closest('#scrim')) { $('#side').classList.remove('on'); $('#scrim').classList.remove('on'); } });

  /* search */
  var qi = $('#q'), sr = $('#sr'), sIdx = 0;
  function search() {
    var q = qi.value.trim().toLowerCase(); if (!q) { sr.classList.remove('on'); return; }
    var hits = [];
    pages.forEach(function (p) { var text = (p.title + ' ' + (p.summary || '') + ' ' + (p.body || '')).replace(/[#`*>|]/g, ' '); var k = text.toLowerCase().indexOf(q); if (k > -1) { var s = text.slice(Math.max(0, k - 50), k + 90).replace(/\s+/g, ' '); hits.push({ p: p, snip: s, score: p.title.toLowerCase().indexOf(q) > -1 ? 0 : 1 }); } });
    hits.sort(function (a, b) { return a.score - b.score; }); sIdx = 0;
    sr.innerHTML = hits.length ? hits.slice(0, 8).map(function (h, i) { return '<a class="' + (i === 0 ? 'on' : '') + '" href="#' + h.p.path + '"><b>' + esc(h.p.title) + ' <span style="font-weight:300">· ' + esc(h.p.section.title) + '</span></b><span>…' + esc(h.snip).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>') + '…</span></a>'; }).join('') : '<a><b>No results</b><span>Try another word.</span></a>';
    sr.classList.add('on');
  }
  qi.addEventListener('input', search); qi.addEventListener('focus', search);
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) sr.classList.remove('on'); if (e.target.closest('#sr a')) { sr.classList.remove('on'); qi.value = ''; } });
  document.addEventListener('keydown', function (e) {
    var typing = ['INPUT', 'TEXTAREA'].indexOf(document.activeElement.tagName) > -1;
    if (e.key === '/' && !typing) { e.preventDefault(); qi.focus(); }
    if (e.key === 'Escape') { sr.classList.remove('on'); qi.blur(); }
    if (sr.classList.contains('on')) { var rows = $$('#sr a[href]'); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sIdx = (sIdx + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length; rows.forEach(function (r, i) { r.classList.toggle('on', i === sIdx); }); } if (e.key === 'Enter' && rows[sIdx]) { location.hash = rows[sIdx].getAttribute('href'); sr.classList.remove('on'); qi.value = ''; qi.blur(); } }
  });
  render();
})();
</script>
</body>
</html>
