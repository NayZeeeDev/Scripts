<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nayzeee heistpack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- task HUD (transparent) -->
    <div id="hud" class="hud hidden"></div>

    <!-- notifications -->
    <div id="notify" class="notify"></div>

    <!-- [E] prompts -->
    <div id="textui" class="textui hidden"></div>

    <!-- progress -->
    <div id="progress" class="progress hidden">
        <div class="progress-label"><span id="progress-text"></span><b id="progress-pct">0%</b></div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <div class="progress-hint"><span class="key">X</span><span data-t="cancel">Cancel</span></div>
    </div>

    <!-- market delivery countdown -->
    <div id="delivery" class="delivery hidden"></div>

    <!-- drone camera overlay -->
    <div id="drone" class="drone hidden"></div>

    <!-- crew invite -->
    <div id="invite" class="invite hidden"></div>

    <!-- heist result -->
    <div id="result" class="result hidden"></div>

    <!-- minigames -->
    <div id="minigame" class="minigame hidden"></div>

    <!-- tablet -->
    <div id="tablet" class="tablet-wrap hidden">
        <div class="frame">
            <div class="shell">
                <div class="bar">
                    <div class="bar-brand">
                        <div class="mark"></div>
                        <div class="bar-name">
                            <div class="title-txt" data-t="brand">NAYZEEE HEISTPACK</div>
                            <div class="sub" data-t="brand_sub">Underground network · Los Santos</div>
                        </div>
                    </div>
                    <div class="bar-mid">
                        <span class="dot" id="bar-dot"></span>
                        <p id="bar-status"></p>
                        <span class="ver">v2.0.0</span>
                    </div>
                    <button class="pill-close" id="close-btn" data-t="close">Close</button>
                </div>
                <div class="body">
                    <nav class="side" id="side"></nav>
                    <main class="main">
                        <div class="head">
                            <div><h1 id="page-title">Heists</h1><p id="page-sub"></p></div>
                            <div class="clock"><b id="clock-time">--:--</b><span id="clock-date"></span></div>
                        </div>
                        <section id="page" class="page"></section>
                    </main>
                </div>
                <div class="statusbar" id="statusbar"></div>
            </div>
        </div>
    </div>

    <script src="icons.js"></script>
    <script src="minigames.js"></script>
    <script src="app.js"></script>
</body>
</html>
