<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hair Plug</title>
<link rel="stylesheet" href="../css/fa.min.css">
<link rel="stylesheet" href="phone.css">
</head>
<body>
<div class="ph" id="ph">
  <header class="ph-head">
    <div class="ph-brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15c-1-6 2.5-11 7-11s8 5 7 11"/><path d="M5 15c0 3 1 5 2.5 5.5M19 15c0 3-1 5-2.5 5.5"/><path d="M8.5 9.5c1.5 1 5.5 1 7 0"/></svg></div><div><b id="phName">Hair Plug</b><span id="phSub">Loading</span></div></div>
  </header>
  <div class="ph-deal" id="phDeal" hidden></div>
  <main class="ph-main" id="phMain"><div class="ph-empty"><i class="fa-solid fa-circle-notch fa-spin"></i></div></main>
  <div class="ph-sheet" id="phSheet" hidden></div>
  <nav class="ph-tabs" id="phTabs">
    <button data-tab="sell" class="on"><i class="fa-solid fa-sack-dollar"></i><span>Sell</span></button>
    <button data-tab="market"><i class="fa-solid fa-store"></i><span>Market</span></button>
    <button data-tab="orders"><i class="fa-solid fa-clipboard-list"></i><span>Orders</span></button>
    <button data-tab="prices"><i class="fa-solid fa-chart-simple"></i><span>Prices</span></button>
  </nav>
</div>
<script src="phone.js"></script>
</body>
</html>
