<!DOCTYPE html>
<html lang="en" data-shape="cut">
<head>
<meta charset="utf-8">
<title>NAYZEEE Ambulance · UI kit</title>
<!-- Dev reference only (not shipped): every shared component of core/nza.js on one page. -->
<link rel="stylesheet" href="core/nz-core.css">
<link rel="stylesheet" href="core/nza.css">
<style>
  #kitbar{position:fixed;left:24px;top:24px;display:flex;gap:16px;align-items:flex-start;pointer-events:auto;zoom:var(--nza-zoom)}
  .kcol{display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<div id="nza-root"><section id="app-kit" class="nza-app" data-app="kit"></section><section id="app-kitwin" class="nza-app" data-app="kitwin"></section></div>
<div id="nza-layer-anchors"></div><div id="nza-layer-speech"></div><div id="nza-layer-prompt"></div><div id="nza-layer-toasts"></div>
<script src="core/nz-core.js"></script>
<script src="core/nza.js"></script>
<script src="core/nza-vitals.js"></script>
<script>
NZA.app('kit', {
  escClose: false,
  init(el) {
    el.innerHTML = `<div id="kitbar">
      <div class="kcol">
        <div class="nza-hud rail red" style="padding:16px 18px;width:330px">
          <div class="nza-label">Status ring · rolling counter</div>
          <div style="display:flex;align-items:center;gap:14px;margin-top:10px"><div id="dring" style="flex:none"></div>
            <div style="display:flex;align-items:center;gap:10px"><span class="nza-h" style="font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#ff9a9d">Down</span><span class="nza-sub">·</span><div id="flip"></div></div></div>
        </div>
        <div class="nza-hud" style="width:330px;overflow:hidden"><div id="mon"></div></div>
        <div class="nza-hud" style="padding:14px;width:330px" id="ctrls"></div>
      </div>
      <div class="kcol">
        <div class="nza-hud" style="padding:12px 14px;width:360px">
          <div style="display:flex;align-items:center;gap:10px"><span class="prio p1">P1</span><span class="prio p2">P2 URGENT</span><span class="prio p3">P3</span><span class="chipx sm red">Critical</span></div>
          <div class="nza-sep"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-teal">Respond</button><button class="btn-line">Decline</button><button class="btn-red">Abort</button><button class="pill-close">Close</button></div>
          <div class="nza-sep"></div>
          <div style="display:flex;gap:10px;align-items:center"><div id="scores" style="display:flex;gap:10px;align-items:center"></div>
            <div style="display:flex;gap:6px"><kbd>E</kbd><kbd class="teal">Space</kbd><kbd class="red">ESC</kbd></div></div>
        </div>
        <div class="nza-hud" style="padding:12px 14px;width:360px;display:flex;gap:18px;align-items:center">
          <div id="glyph" style="width:64px;height:132px;flex:none"></div>
          <div id="rings" style="display:flex;gap:14px"></div>
        </div>
      </div>
    </div>`;
    const flip = NZA.ui.FlipClock(el.querySelector('#flip'), { value: '01:57' });
    const dring = el.querySelector('#dring');
    const down = s => { dring.innerHTML = NZA.ui.Ring({ value: Math.ceil(s / 60), unit: 'min', frac: s / 120, tone: s < 30 ? 'red' : 'amber', label: 'Left' }); };
    let s = 117; down(s);
    setInterval(() => { s = s > 0 ? s - 1 : 120; flip.set(NZA.fmt.time(s)); flip.tone(s < 30 ? 'red' : ''); down(s); }, 1000);
    const mon = NZA.vitals.Monitor(el.querySelector('#mon'), { compact: true, height: 140, beep: false });
    mon.update({ hr: 124, spo2: 93, sys: 96, dia: 61, map: 73, rr: 24, temp: 36.4, rhythm: 'stach' });
    // results are score rings (teal ≥ 72 · amber ≥ 40 · red), never letter grades
    el.querySelector('#scores').innerHTML = [92, 61, 28].map(v => NZA.ui.ScoreRing({ score: v, size: 'lg' })).join('');
    el.querySelector('#glyph').innerHTML = NZA.ui.BodyGlyph({ l_upper_leg: 'red', chest: 'amber', r_lower_arm: 'teal' }, 'l_upper_leg');
    el.querySelector('#rings').innerHTML = [
      NZA.ui.Ring({ value: 124, frac: 0.66, tone: 'green', label: 'HR', beat: 60 / 124 }),
      NZA.ui.Ring({ value: 93, frac: 0.93, tone: 'cyan', label: 'SpO2', unit: '%' }),
      NZA.ui.Ring({ value: 96, frac: 0.5, tone: 'amber', label: 'Sys' }),
    ].join('');
    const c = el.querySelector('#ctrls');
    c.innerHTML = '<div class="opt"><div class="opt-t"><b>Easy mode</b><small>Minigames become progress bars</small></div><span id="tg"></span></div><div class="opt"><div class="opt-t"><b>Site</b></div><span id="seg"></span></div><div class="opt col"><div class="opt-t"><b>Roller clamp</b></div><span id="sl"></span></div><span id="ch"></span>';
    NZA.ui.Toggle(c.querySelector('#tg'), { on: true });
    NZA.ui.Segmented(c.querySelector('#seg'), { options: [{ value: 'c', label: 'Carotid' }, { value: 'r', label: 'Radial' }], value: 'r' });
    NZA.ui.Slider(c.querySelector('#sl'), { value: 66, format: v => v + '%' });
    NZA.ui.Chips(c.querySelector('#ch'), { options: [{ value: 'a', label: 'Assess', icon: 'pulse' }, { value: 'b', label: 'Suture', icon: 'needle' }, { value: 'c', label: 'Surgery', icon: 'scalpel' }], values: ['a', 'c'] });
    this.pp = NZA.ui.ProcPanel(el, {
      step: 3, total: 5, skipped: [2], tag: 'Laceration · Forearm', steps: ['Rinse', 'Numb', 'Close the cut', 'Check the line', 'Cover'], title: 'Close the cut', text: 'Drag across the cut and let go to tie each stitch. Hold {Click} to drag.',
      stats: [{ label: 'Site', value: 'Forearm', small: true }, { label: 'Gap', value: 38, unit: 'mm' }, { id: 'ooze', label: 'Ooze', value: '1.1', unit: 'mL/min', tone: 'amber' }],
      wide: { label: 'Stitches', value: '4', unit: '/9', meter: { value: 0.44, zone: [0.4, 0.6], mark: 0.5 }, caption: 'Space them evenly', captionTone: 'teal' },
      tools: [{ key: '1', label: 'Irrigation', sub: '30 mL', state: 'done' }, { key: '2', label: 'Anaesthetic', sub: '1 %', icon: 'syringe', state: 'done' }, { key: '3', label: 'Needle holder', state: 'active' },
        { key: '4', label: 'Toothed forceps' }, { key: '5', label: 'Skin stapler', sub: 'Step 4 first', state: 'locked' }, { key: '6', label: 'Strip tape' }],
      hints: [{ keys: ['Right click'], label: 'orbit' }, { keys: ['Shift', 'Right click'], label: 'pan' }],
      onAbort: () => NZA.toast({ title: 'Stopped', message: 'Nothing was used up.', type: 'error' }),
      onTool: k => this.pp.active(k),
    });
    setTimeout(() => this.pp.flash('ok', 'Needle is in the marrow — flush it.', 0), 300);
  },
  keys: { '1'(e) { return NZA.apps.kit.pp.key(e); }, '2'(e) { return NZA.apps.kit.pp.key(e); }, '3'(e) { return NZA.apps.kit.pp.key(e); }, '4'(e) { return NZA.apps.kit.pp.key(e); }, '5'(e) { return NZA.apps.kit.pp.key(e); }, '6'(e) { return NZA.apps.kit.pp.key(e); } },
});
NZA.app('kitwin', {
  init(el) {
    const w = NZA.ui.Win(el, { title: 'Station log', sub: 'Station 1 · Pillbox Hill', width: '760px', height: '370px',
      mid: '<span class="nz-dot"></span><p>Connected to <b>dispatch</b> · 4 units on duty</p><span class="nz-ver">v1.0.0</span>',
      nav: [{ id: 'shift', label: 'This shift', icon: 'clock' }, { group: 'Crew' }, { id: 'units', label: 'Units out', icon: 'ambulance', tally: 3 }, { id: 'certs', label: 'Certificates', icon: 'shield-check' }],
      navValue: 'shift', status: [{ key: 'ESC', label: 'Close' }, { key: '↵', label: 'Open' }], onClose: () => NZA.close('kitwin') });
    w.main.innerHTML = '<div class="w-head"><div><h1>This shift</h1><p>Calls, units and handovers since 06:00.</p></div></div><div class="w-stats"><div class="w-stat"><div class="nz-tile">' + NZA.icon('clipboard') + '</div><div><span>Calls closed</span><b>14</b></div></div><div class="w-stat"><div class="nz-tile red">' + NZA.icon('heart') + '</div><div><span>Handovers</span><b>9</b></div></div></div>';
    w.el.style.margin = '160px 230px auto auto';
  },
});
NZA.demo('kit', {}); NZA.demo('kitwin', {});
NZA.applyBg = (() => { document.body.prepend(NZA.el('div', 'nza-bg')); })();
NZA.toast({ title: 'Report filed', message: 'MED-215 was saved to the patient record.' });
NZA.toast({ title: 'Wound closed', message: 'Nine even stitches · bleeding stopped.', score: 86 });
NZA.toast({ title: "You're not on duty", message: 'Sign in at the station terminal.', type: 'error' });
NZA.speech({ name: 'Dana Whitlock', text: 'Ow — is it bad?', ms: 60000 });
NZA.prompt('desk', { key: 'E', label: 'Register at the desk', sub: 'Front desk' });
NZA.ui.Marker('kit', 'binder', { label: 'Place the binder', at: { x: 0.42, y: 0.42 } });
NZA.ui.Marker('kit', 'drag', { label: 'Slide the splint', tone: 'red', dot: 'red', at: { x: 0.30, y: 0.52 } });
</script>
</body>
</html>
